services:
  - type: web
    name: t-care-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: tcare-media
      - key: FRONTEND_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM_NAME
        value: T-CARE
      # Preserve existing owner-managed production booking payment setting.
      # Backend config defaults to false if no value is supplied.
      - key: PAYMENTS_ENABLED
        sync: false
      # The new Plant Store remains fail-closed until migration and provider checks pass.
      - key: STORE_CHECKOUT_ENABLED
        value: "false"
      # QR Codes are an on-demand Razorpay capability. The backend default is false;
      # keep this owner-managed so future Blueprint syncs cannot overwrite a deliberate activation.
      - key: RAZORPAY_QR_ENABLED
        sync: false
      # Preserve any owner-managed UPI AutoPay activation; backend config defaults to false.
      - key: RAZORPAY_SUBSCRIPTIONS_ENABLED
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      # Owner-managed: set test on isolated staging, live only on production.
      - key: RAZORPAY_MODE
        sync: false
      - key: BOOKING_CONVENIENCE_FEE
        value: "0"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_TOLERANCE_SECONDS
        value: "300"
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
